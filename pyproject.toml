[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raga"
version = "0.1.0"
description = "RAGA - Adaptive Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.7",
    "textual-dev>=1.8.0",
    "websockets>=16.0",
    "uvicorn>=0.49.0",
    "fastapi>=0.138.2",
    "pydantic>=2.13.4",
    "openai>=2.44.0",
    "aiosqlite>=0.22.1",
    "typer>=0.27.0",
    "inquirerpy>=0.3.4",
]

[project.scripts]
raga = "cli:main"
